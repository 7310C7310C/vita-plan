<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>管理后台 - 复活计划乐队</title>
    <link rel="stylesheet" href="admin.css?v=20260802030000">
</head>
<body>

<!-- ==================== 登录界面 ==================== -->
<div id="loginView" class="view active">
    <div class="login-container">
        <div class="login-icon">🎸</div>
        <h1 class="login-title">复活计划乐队</h1>
        <h2 class="login-subtitle">管理后台</h2>
        <div class="login-input-group">
            <label class="login-label">GitHub Personal Access Token</label>
            <input type="password" class="login-input" id="tokenInput" placeholder="粘贴你的 GitHub Token..." autocomplete="off">
            <div class="login-hint" id="tokenHint"></div>
        </div>
        <label class="login-remember">
            <input type="checkbox" id="rememberToken" checked>
            <span>记住我（加密存储在本地）</span>
        </label>
        <button class="login-btn" id="loginBtn">登 录</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<!-- ==================== 主界面 ==================== -->
<div id="mainView" class="view">
    <!-- 加载中遮罩 -->
    <div id="mainLoadingOverlay" style="display:flex;position:fixed;top:56px;left:0;width:100%;height:calc(100vh - 56px);background:var(--bg);z-index:99;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
        <div class="loading-spinner"></div>
        <div style="color:var(--text-light);font-size:0.95rem;">正在从 GitHub 加载数据……</div>
    </div>
    <!-- 顶部导航栏 -->
    <nav class="topbar">
        <span class="topbar-title">🎸 管理后台</span>
        <span class="topbar-subtitle" id="topbarUser"></span>
        <button class="topbar-btn" id="logoutBtn" title="退出登录">🚪</button>
    </nav>

    <!-- 仪表盘 -->
    <div id="dashboardView" class="subview active">
        <div class="dashboard-grid">
            <!-- 本周歌曲卡片 -->
            <div class="dash-card" id="dashWeekly">
                <div class="dash-card-icon">📅</div>
                <div class="dash-card-title">本周歌曲</div>
                <div class="dash-card-info" id="dashWeeklyInfo">加载中...</div>
                <div class="dash-card-action">编辑 →</div>
            </div>

            <!-- 歌曲管理卡片 -->
            <div class="dash-card" id="dashSongs">
                <div class="dash-card-icon">🎵</div>
                <div class="dash-card-title">歌曲管理</div>
                <div class="dash-card-info" id="dashSongsInfo">加载中...</div>
                <div class="dash-card-action">管理 →</div>
            </div>

            <!-- 网站设置卡片 -->
            <div class="dash-card" id="dashSettings">
                <div class="dash-card-icon">⚙️</div>
                <div class="dash-card-title">网站设置</div>
                <div class="dash-card-info" id="dashSettingsInfo"></div>
                <div class="dash-card-action">设置 →</div>
            </div>

            <!-- 提交历史卡片 -->
            <div class="dash-card" id="dashHistory">
                <div class="dash-card-icon">📋</div>
                <div class="dash-card-title">提交历史</div>
                <div class="dash-card-info" id="dashHistoryInfo">点击查看</div>
                <div class="dash-card-action">查看 →</div>
            </div>
        </div>

        <!-- 待发布更改 -->
        <div class="dash-pending" id="dashPending">
            <div class="dash-pending-header">
                <span class="dash-pending-title">📋 待发布的更改</span>
                <span class="dash-pending-count" id="pendingCount">0 项</span>
            </div>
            <div class="dash-pending-list" id="pendingList"></div>
            <div style="display:flex;gap:10px;">
                <button class="publish-btn" id="publishBtn" disabled style="flex:1;">🚀 发布到 GitHub</button>
                <button class="small-btn" id="clearPendingBtn" style="display:none;background:var(--danger-light);color:var(--danger);flex-shrink:0;">🗑️ 清除</button>
            </div>
            <div class="dash-publish-info" id="dashPublishInfo"></div>
        </div>

    </div>

    <!-- 歌曲管理 -->
    <div id="songsView" class="subview">
        <div class="subview-header">
            <button class="back-btn" id="songsBackBtn">← 返回仪表盘</button>
            <h2 class="subview-title">歌曲管理</h2>
            <button class="add-btn" id="addCategoryBtn">+ 新增分类</button>
        </div>
        <div class="category-list" id="categoryList"></div>
    </div>

    <!-- 分类详情（歌曲列表） -->
    <div id="categoryDetailView" class="subview">
        <div class="subview-header">
            <button class="back-btn" id="catDetailBackBtn">← 返回歌曲管理</button>
            <h2 class="subview-title" id="catDetailTitle"></h2>
            <div class="subview-header-actions">
                <button class="small-btn" id="renumberBtn" title="重整编号">重整编号</button>
                <button class="add-btn" id="addSongBtn">+ 新增歌曲</button>
            </div>
        </div>
        <div class="subview-info" id="catDetailInfo"></div>
        <div class="song-list" id="songList"></div>
    </div>

    <!-- 新增/编辑歌曲 -->
    <div id="songFormView" class="subview">
        <div class="subview-header">
            <button class="back-btn" id="songFormBackBtn">← 返回</button>
            <h2 class="subview-title" id="songFormTitle">新增歌曲</h2>
        </div>
        <div class="form-container" id="songFormContainer"></div>
    </div>

    <!-- 本周歌曲编辑 -->
    <div id="weeklyView" class="subview">
        <div class="subview-header">
            <button class="back-btn" id="weeklyBackBtn">← 返回仪表盘</button>
            <h2 class="subview-title">本周歌曲</h2>
        </div>
        <div class="weekly-container" id="weeklyContainer"></div>
    </div>

    <!-- 网站设置 -->
    <div id="settingsView" class="subview">
        <div class="subview-header">
            <button class="back-btn" id="settingsBackBtn">← 返回仪表盘</button>
            <h2 class="subview-title">网站设置</h2>
        </div>
        <div class="settings-container" id="settingsContainer"></div>
    </div>

    <!-- 提交历史 -->
    <div id="historyView" class="subview">
        <div class="subview-header">
            <button class="back-btn" id="historyBackBtn">← 返回仪表盘</button>
            <h2 class="subview-title">📋 Git 提交历史</h2>
        </div>
        <div class="history-container" id="historyContainer"></div>
    </div>
</div>

<!-- ==================== 弹窗层 ==================== -->
<div id="modalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-box" id="modalBox"></div>
</div>

<!-- ==================== Toast 容器 ==================== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ==================== 图片裁剪模态框 ==================== -->
<div id="cropModal" class="crop-modal" style="display:none;">
    <div class="crop-modal-content">
        <div class="crop-modal-header">
            <h3>✂️ 裁剪图片</h3>
            <button class="crop-close" id="cropClose">×</button>
        </div>
        <div class="crop-hint">
            💡 乐谱图片通常四周有较多空白边距，裁剪掉左右多余的空白后，在平板等设备上能看到更大的乐谱内容，阅读更舒适。
        </div>
        <div class="crop-canvas-wrapper">
            <canvas id="cropCanvas"></canvas>
            <div class="crop-left-handle" id="cropLeftHandle"></div>
            <div class="crop-right-handle" id="cropRightHandle"></div>
            <div class="crop-top-handle" id="cropTopHandle"></div>
            <div class="crop-bottom-handle" id="cropBottomHandle"></div>
        </div>
        <div class="crop-actions">
            <span class="crop-info" id="cropInfo">拖动边界线调整裁剪范围</span>
            <button class="crop-btn cancel" id="cropSkipBtn">跳过裁剪</button>
            <button class="crop-btn confirm" id="cropConfirmBtn">✂️ 确认裁剪</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="admin.js?v=20261020183000"></script>
</body>
</html>
