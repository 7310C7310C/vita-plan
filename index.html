<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>复活计划乐队</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/style.css?v=20261020170032">
    <style>
        #loadingOverlay {
            display: block;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 104;
        }
        #loadingIndicator {
            display: block;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            z-index: 105;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>
    <!-- 主界面 -->
    <div id="main-view" class="container">
        <h1 class="main-title">复活计划乐队</h1>
        
        <div class="search-container">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索歌曲……" autocomplete="off">
                <div class="search-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <div class="clear-search" id="clearSearch">×</div>
            </div>
        </div>
        
        <div class="search-results" id="searchResults">
            <h3 class="search-results-title">搜索结果</h3>
            <div class="songs-list" id="searchResultsList">
                <!-- 搜索结果将通过JS动态加载 -->
            </div>
        </div>
        
        <div class="version-preference" id="versionPreference">
            <span>优先显示：</span>
            <select class="version-select" id="versionSelect">
                <!-- 选项将通过JS动态加载 -->
            </select>
        </div>
        
        <div class="offline-card" id="offlineSection" aria-label="离线歌谱">
            <button class="offline-card-btn" id="offlineActionBtn" type="button" disabled>正在读取离线状态……</button>
            <span class="offline-card-status" id="offlineStatus" aria-live="polite">正在读取离线状态……</span>
        </div>

        <button class="category-card" id="weeklyButton">
            <h2 style="margin: 0;">本周歌曲</h2>
            <div class="update-date" id="weeklyButtonDate"></div>
        </button>
        
        <div class="categories-list" id="categoriesContainer">
            <!-- 分类将通过JS动态加载 -->
        </div>
    </div>
    
    <!-- 右上角历史/收藏按钮 -->
    <button class="history-button" id="historyButton">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"></path>
            <path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z"></path>
        </svg>
    </button>
    
    <!-- 语言切换按钮 -->
    <button class="language-button" id="languageButton">中/En</button>
    
    <!-- 历史/收藏面板 -->
    <div class="history-panel-container" id="historyPanel">
        <div class="history-panel-header">
            <h3 class="history-panel-title">历史与收藏</h3>
            <button class="history-panel-close" id="historyPanelClose">×</button>
        </div>
        <div class="history-tab-container">
            <div class="history-tab active" id="recentTab">最近查看</div>
            <div class="history-tab" id="favoritesTab">收藏</div>
        </div>
        <div class="history-panel-content">
            <div class="history-tab-panel active" id="recentPanel">
                <div class="section-header">
                    <h2 class="section-title">最近查看</h2>
                    <button class="clear-button" id="clearRecentlyViewed">清空</button>
                </div>
                <div class="songs-list" id="recentlyViewedList">
                    <!-- 最近查看的歌曲将通过JS动态加载 -->
                </div>
            </div>
            <div class="history-tab-panel" id="favoritesPanel">
                <div class="section-header">
                    <h2 class="section-title">收藏</h2>
                </div>
                <div class="songs-list" id="favoritesList">
                    <!-- 收藏的歌曲将通过JS动态加载 -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- 分类界面 -->
    <div id="category-view" class="container">
        <button class="back-button" id="backButton">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            返回
        </button>
        <h2 id="categoryTitle"></h2>
        <div class="songs-list" id="songsContainer">
            <!-- 歌曲列表将通过JS动态加载 -->
        </div>
    </div>
    
    <!-- 本周歌曲界面 -->
    <div id="weekly-view" class="container">
        <button class="back-button" id="backButtonWeekly">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            返回
        </button>
        <h2 id="weeklyTitle">本周歌曲</h2>
        <div class="update-date" id="updateDate"></div>
        <div class="songs-list" id="weeklySongsContainer">
            <!-- 本周歌曲列表将通过JS动态加载 -->
        </div>
    </div>
    
    <!-- 乐谱查看器 -->
    <div id="viewer-view">
        <button class="close-button" id="close-viewer">×</button>
        <button class="favorite-button" id="favoriteButton">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
            </svg>
        </button>
        <div id="viewer-breadcrumb" class="viewer-breadcrumb"></div>
        <div class="viewer-content" id="viewerContent">
            <div class="sheet-container">
                <img id="sheet-image" class="sheet-image" src="" alt="乐谱">
                <canvas id="doodle-canvas" style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:10;"></canvas>
                <canvas id="doodle-preview-canvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:11;"></canvas>
            </div>
        </div>
        
        <!-- 底部控制栏，包含歌曲导航、版本切换和页码控制 -->
        <div class="page-controls-container">
            <!-- 上一首按钮 -->
            <div class="song-nav" id="prev-song">
                <span class="song-nav-text">上一首</span>
            </div>
            
            <!-- 版本切换按钮 -->
            <button class="version-toggle-button" id="versionToggleButton">
                <span id="versionButtonText">版本</span>
                <span class="arrow">▼</span>
            </button>
            
            <!-- 版本选择菜单 -->
            <div class="version-buttons" id="versionButtons">
                <!-- 版本切换按钮将通过JS动态加载 -->
            </div>
            
            <!-- 涂改相关按钮 -->
            <button class="doodle-btn" id="doodleEnterBtn" style="margin-left:10px;">涂改</button>
            <button class="doodle-btn" id="doodleExitBtn" style="display:none;margin-left:10px;opacity:0.9;">保存涂改</button>
            <button class="doodle-btn" id="doodleClearBtn" style="display:none;margin-left:5px;opacity:0.9;">清空涂改</button>
            <button class="doodle-btn" id="doodleEraserBtn" style="display:none;margin-left:5px;opacity:0.9;">橡皮擦</button>
            <button class="doodle-btn" id="doodleUndoBtn" style="display:none;margin-left:5px;" title="撤回">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 14l-4-4 4-4"/>
                    <path d="M5 10h7a4 4 0 1 1 0 8h-1"/>
                </svg>
            </button>
            <button class="doodle-btn" id="doodleRedoBtn" style="display:none;margin-left:5px;" title="重做">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 10l4 4-4 4"/>
                    <path d="M19 14h-7a4 4 0 1 1 0-8h1"/>
                </svg>
            </button>
            
            <!-- 页码控制 -->
            <div class="page-indicator-container">
                <div class="page-nav" id="prev-page">‹</div>
                <div class="page-indicator" id="page-indicator">1 / 1</div>
                <div class="page-nav" id="next-page">›</div>
            </div>
            
            <!-- 适应模式切换按钮位于页码指示器和下一首之间 -->
            <button class="doodle-btn" id="fitModeBtn" style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:transparent;border:none;cursor:pointer;margin:0 0px;">
                <!-- 全屏/退出全屏图标 -->
                <svg id="fitModeIconExpand" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="white" stroke-width="2" style="opacity:0.8;"><polyline points="3,9 3,3 9,3"/><line x1="3" y1="3" x2="9" y2="9"/><polyline points="19,13 19,19 13,19"/><line x1="19" y1="19" x2="13" y2="13"/><polyline points="13,3 19,3 19,9"/><line x1="19" y1="3" x2="13" y2="9"/><polyline points="9,19 3,19 3,13"/><line x1="3" y1="19" x2="9" y2="13"/></svg>
                <svg id="fitModeIconCollapse" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="white" stroke-width="2" style="opacity:0.8;display:none;"><polyline points="9,3 3,3 3,9"/><line x1="3" y1="3" x2="9" y2="9"/><polyline points="13,19 19,19 19,13"/><line x1="19" y1="19" x2="13" y2="13"/><polyline points="19,9 19,3 13,3"/><line x1="19" y1="3" x2="13" y2="9"/><polyline points="3,13 3,19 9,19"/><line x1="3" y1="19" x2="9" y2="13"/></svg>
            </button>
            
            <!-- 下一首按钮 -->
            <div class="song-nav" id="next-song">
                <span class="song-nav-text">下一首</span>
            </div>
        </div>
    </div>
    
    <div class="loading-overlay" id="loadingOverlay"></div>
    <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-spinner"></div>
        <div>加载中……</div>
    </div>

    <div id="version-modal" style="display:none;position:fixed;z-index:2000;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.45);justify-content:center;align-items:center;">
      <div style="background:#fffbe9;padding:32px 28px 24px 28px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.13);min-width:260px;text-align:center;">
        <h2 id="modalVersionTitle" style="color:#8c6a4d;font-size:1.3rem;margin-bottom:18px;">请选择优先显示版本</h2>
        <div id="modalVersionBtnList" style="display:flex;flex-direction:column;gap:14px;margin-bottom:10px;"></div>
      </div>
    </div>
    <script src="assets/js/script.js?v=20261020170032"></script>
    <script src="assets/js/offline.js?v=20261020202640"></script>
</body>
</html>
